<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>480x320 Touchscreen UI Preview</title>
  <style>
    :root {
      --bg: #041322;
      --surface: #1b2431;
      --tab-idle: #041322;
      --tab-active: #1b2431;
      --accent: #f8f6f1;
      --text: #f8f6f1;
      --text-dim: #a9acb6;
      --track: #646d7e;
      --screen-fill: #f8f6f1;
      --light-fill: #a9acb6;
      --btn-contract: #1b2431;
      --btn-contract-pressed: #f8f6f1;
      --btn-retract: #646d7e;
      --btn-retract-pressed: #f8f6f1;
      --btn-border: #a9acb6;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #041322;
      color: #a9acb6;
      font-family: Consolas, "Courier New", monospace;
    }

    h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.16em; color: #a9acb6; margin: 0; }

    #device {
      width: 480px;
      height: 320px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      border: 8px solid #1b2431;
      border-radius: 6px;
    }

    #tabs {
      display: flex;
      height: 44px;
      position: relative;
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tab-idle);
      color: var(--text-dim);
      font-size: 22px;
      cursor: pointer;
      position: relative;
    }

    .tab.active { background: var(--tab-active); color: var(--text); }

    .tab + .tab::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      height: 28px;
      width: 1px;
      background: var(--track);
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 0;
      height: 3px;
      background: var(--accent);
    }

    #accent-line {
      height: 1px;
      background: var(--accent);
    }

    #content {
      position: absolute;
      left: 0;
      top: 45px;
      width: 480px;
      height: 275px;
    }

    .screen { position: absolute; inset: 0; display: none; }
    .screen.active { display: block; }

    .card {
      position: absolute;
      left: 10px;
      width: 460px;
      background: var(--surface);
      border: 1px solid var(--track);
      border-radius: 12px;
    }

    .card.main { height: 122px; }
    .card.speed { height: 96px; }

    #screen-card { top: 10px; }
    #light-card { top: 142px; }
    #height-speed, #position-speed { top: 10px; }

    .card-icon {
      position: absolute;
      left: 14px;
      top: 12px;
      width: 28px;
      height: 28px;
      color: var(--screen-fill);
    }

    #light-card .card-icon { color: var(--light-fill); }

    .card-label {
      position: absolute;
      left: 44px;
      top: 12px;
      font-size: 22px;
      color: var(--text);
    }

    .card-value {
      position: absolute;
      right: 14px;
      top: 12px;
      font-size: 22px;
      color: var(--text);
      width: 64px;
      text-align: right;
    }

    .slider {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 44px;
      top: 52px;
      cursor: pointer;
    }

    .card.speed .slider { top: 46px; }

    .track {
      position: absolute;
      left: 0;
      right: 0;
      top: 15px;
      height: 14px;
      background: var(--track);
      border-radius: 7px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 80%;
      background: var(--screen-fill);
      border-radius: 7px;
    }

    #light-card .fill { background: var(--light-fill); width: 40%; }
    .card.speed .fill { background: var(--accent); width: 50%; }
    .card.speed .card-label { left: 16px; }

    .knob {
      position: absolute;
      top: 6px;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--screen-fill);
      box-shadow: inset 0 0 0 6px var(--screen-fill);
      pointer-events: none;
    }

    #light-card .knob {
      border-color: var(--light-fill);
      box-shadow: inset 0 0 0 6px var(--light-fill);
    }

    .card.speed .knob {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 6px var(--accent);
    }

    .hold-btn {
      position: absolute;
      top: 116px;
      width: 225px;
      height: 149px;
      border-radius: 12px;
      border: 1px solid var(--btn-border);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 20px;
      cursor: pointer;
    }

    .hold-btn .chevron {
      width: 0;
      height: 0;
      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
    }

    .hold-btn.contract {
      left: 10px;
      background: var(--btn-contract);
    }

    .hold-btn.contract .chevron {
      border-top: 28px solid var(--text);
    }

    .hold-btn.retract {
      left: 245px;
      background: var(--btn-retract);
    }

    .hold-btn.retract .chevron {
      border-bottom: 28px solid var(--text);
    }

    .hold-btn.contract.pressed {
      background: var(--btn-contract-pressed);
      color: var(--bg);
      box-shadow: inset 0 0 0 3px var(--bg);
    }

    .hold-btn.contract.pressed .chevron { border-top-color: var(--bg); }

    .hold-btn.retract.pressed {
      background: var(--btn-retract-pressed);
      color: var(--bg);
      box-shadow: inset 0 0 0 3px var(--bg);
    }

    .hold-btn.retract.pressed .chevron { border-bottom-color: var(--bg); }
  </style>
</head>
<body>
  <h1>480 × 320 TOUCHSCREEN PREVIEW</h1>
  <div id="device">
    <div id="tabs">
      <div class="tab active" data-screen="main">Main</div>
      <div class="tab" data-screen="height">Height</div>
      <div class="tab" data-screen="position">Position</div>
    </div>
    <div id="accent-line"></div>
    <div id="content">
      <section id="main" class="screen active">
        <div class="card main" id="screen-card">
          <svg class="card-icon" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="14" cy="14" r="6" fill="currentColor" stroke="none"/>
            <path d="M14 2v4M14 22v4M2 14h4M22 14h4M5 5l3 3M20 20l3 3M5 23l3-3M20 8l3-3"/>
          </svg>
          <div class="card-label">SCREEN</div>
          <div class="card-value" id="screen-value">80%</div>
          <div class="slider" data-slider="screen">
            <div class="track"><div class="fill" id="screen-fill"></div></div>
            <div class="knob" id="screen-knob"></div>
          </div>
        </div>
        <div class="card main" id="light-card">
          <svg class="card-icon" viewBox="0 0 28 28" fill="currentColor">
            <circle cx="14" cy="11" r="7"/>
            <path d="M8 12 L14 22 L20 12 Z"/>
            <rect x="11" y="20" width="6" height="3"/>
            <rect x="9" y="24" width="10" height="1.5"/>
          </svg>
          <div class="card-label">LIGHT</div>
          <div class="card-value" id="light-value">40%</div>
          <div class="slider" data-slider="light">
            <div class="track"><div class="fill" id="light-fill"></div></div>
            <div class="knob" id="light-knob"></div>
          </div>
        </div>
      </section>

      <section id="height" class="screen">
        <div class="card speed" id="height-speed">
          <div class="card-label">SPEED</div>
          <div class="card-value" id="height-speed-value">50%</div>
          <div class="slider" data-slider="height-speed">
            <div class="track"><div class="fill" id="height-speed-fill"></div></div>
            <div class="knob" id="height-speed-knob"></div>
          </div>
        </div>
        <button class="hold-btn contract" type="button"><span class="chevron"></span>CONTRACT</button>
        <button class="hold-btn retract" type="button"><span class="chevron"></span>RETRACT</button>
      </section>

      <section id="position" class="screen">
        <div class="card speed" id="position-speed">
          <div class="card-label">SPEED</div>
          <div class="card-value" id="position-speed-value">50%</div>
          <div class="slider" data-slider="position-speed">
            <div class="track"><div class="fill" id="position-speed-fill"></div></div>
            <div class="knob" id="position-speed-knob"></div>
          </div>
        </div>
        <button class="hold-btn contract" type="button"><span class="chevron"></span>CONTRACT</button>
        <button class="hold-btn retract" type="button"><span class="chevron"></span>RETRACT</button>
      </section>
    </div>
  </div>
  <script>
    const values = {
      screen: 80,
      light: 40,
      "height-speed": 50,
      "position-speed": 50
    };

    function renderSlider(id, value) {
      const fill = document.getElementById(id + "-fill");
      const knob = document.getElementById(id + "-knob");
      const label = document.getElementById(id + "-value") || document.getElementById(id + "-speed-value");
      fill.style.width = value + "%";
      knob.style.left = value + "%";
      const valueEl = document.getElementById(id + "-value");
      if (valueEl) valueEl.textContent = value + "%";
    }

    ["screen", "light", "height-speed", "position-speed"].forEach((id) => renderSlider(id, values[id]));

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.screen).classList.add("active");
      });
    });

    function sliderFromEvent(sliderEl, event) {
      const rect = sliderEl.getBoundingClientRect();
      const clientX = event.touches ? event.touches[0].clientX : event.clientX;
      const pct = Math.round(((clientX - rect.left) / rect.width) * 100);
      return Math.max(0, Math.min(100, pct));
    }

    document.querySelectorAll(".slider").forEach((slider) => {
      const id = slider.dataset.slider;
      const move = (event) => {
        values[id] = sliderFromEvent(slider, event);
        renderSlider(id, values[id]);
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
      };
      slider.addEventListener("pointerdown", (event) => {
        slider.setPointerCapture(event.pointerId);
        move(event);
        slider.addEventListener("pointermove", move);
        slider.addEventListener("pointerup", () => slider.removeEventListener("pointermove", move));
      });
    });

    document.querySelectorAll(".hold-btn").forEach((btn) => {
      const press = () => btn.classList.add("pressed");
      const release = () => btn.classList.remove("pressed");
      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointerleave", release);
      btn.addEventListener("pointercancel", release);
    });
  </script>
</body>
</html>
